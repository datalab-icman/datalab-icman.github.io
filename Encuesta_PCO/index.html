  <style>
    :root{
      --marino:#0b4f6c; --marino2:#0a3d54; --agua:#1b9aaa; --agua-cl:#e6f6f8;
      --rojo:#c0392b; --texto:#1f2d3d; --gris:#6b7a8d; --linea:#e3e8ee; --fondo:#f4f7fa;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--texto);background:var(--fondo);line-height:1.45}

     
    header{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 2px 8px rgba(11,79,108,.12)}
    .banner{width:100%;background:var(--marino2);text-align:center}
    .banner img{max-width:1181px;width:100%;height:auto;display:block;margin:0 auto}
    nav{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;
        padding:8px 10px;background:var(--marino)}
    nav button{border:0;cursor:pointer;white-space:nowrap;font-size:14px;
        padding:8px 12px;border-radius:999px;background:transparent;color:#dbeef4;transition:.15s}
    nav button:hover{background:rgba(255,255,255,.12);color:#fff}
    nav button.activo{background:#fff;color:var(--marino);font-weight:700}
    nav .inicio{font-weight:600}
    nav .sep{flex:1 1 auto}
    nav .enviar{background:var(--agua);color:#fff;font-weight:700}
    nav .enviar:hover{background:#178796;color:#fff}

     
    main{max-width:920px;margin:0 auto;padding:18px 16px 80px}
    .seccion{display:none;animation:fade .18s ease}
    .seccion.activa{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

    h1{font-size:22px;margin:6px 0 4px;color:var(--marino)}
    .intro{color:var(--gris);white-space:pre-line;background:#fff;border:1px solid var(--linea);
           border-radius:12px;padding:16px 18px}
    .bloque-tit{font-size:20px;color:var(--marino);margin:4px 0 2px}
    .bloque-sub{color:var(--gris);margin:0 0 14px}

    .indicador{background:#fff;border:1px solid var(--linea);border-radius:12px;
               padding:14px 16px;margin:0 0 14px}
    .indicador h3{margin:0 0 2px;font-size:16px;color:var(--marino2)}
    .indicador .nota{color:var(--gris);font-size:13px;margin:0 0 8px}

    .item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--linea)}
    .item:first-of-type{border-top:0}
    .item .txt{flex:1 1 auto;min-width:0}
    .item .q{font-weight:600}
    .item .unidad{color:var(--gris);font-weight:400;font-size:13px}
    .obj{display:block;font-size:13.5px;margin:3px 0 1px}
    .obj strong{color:var(--rojo);font-weight:800}
    .def{display:block;color:var(--gris);font-size:12.5px}
    .item .campo{flex:0 0 130px}
    .item input{width:100%;padding:10px;border:1.5px solid var(--linea);border-radius:9px;
                font-size:16px;text-align:right}
    .item input:focus{outline:0;border-color:var(--agua);box-shadow:0 0 0 3px var(--agua-cl)}

     
    .meta-input{width:100%;padding:11px 12px;border:1.5px solid var(--linea);border-radius:9px;
                font-size:15px;font-family:inherit;color:var(--texto);margin-top:6px}
    .meta-input:focus{outline:0;border-color:var(--agua);box-shadow:0 0 0 3px var(--agua-cl)}
    textarea.meta-input{resize:vertical;min-height:130px;line-height:1.45}

    .pie{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);
         display:flex;justify-content:center;gap:12px;padding:10px}
    .pie button{border:0;border-radius:9px;padding:11px 22px;font-size:15px;font-weight:700;
                cursor:pointer;background:var(--agua);color:#fff}
    .pie button:hover{background:#178796}
    .pie .contador{align-self:center;color:var(--gris);font-size:13px}

     
    .overlay{position:fixed;inset:0;background:rgba(10,61,84,.55);display:none;
             align-items:center;justify-content:center;z-index:100}
    .overlay.visible{display:flex}
    .tarjeta{background:#fff;border-radius:14px;padding:28px 30px;max-width:420px;text-align:center;
             box-shadow:0 12px 40px rgba(0,0,0,.25)}
    .tarjeta h2{margin:0 0 8px;color:var(--marino)}
    .tarjeta p{color:var(--gris);margin:0 0 16px}
    .tarjeta button{border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer;
                    background:var(--agua);color:#fff}
    .spin{width:34px;height:34px;border:4px solid var(--agua-cl);border-top-color:var(--agua);
          border-radius:50%;margin:0 auto 12px;animation:giro 1s linear infinite}
    @keyframes giro{to{transform:rotate(360deg)}}

    @media(max-width:620px){
      .item{flex-wrap:wrap}
      .item .campo{flex:1 1 100%}
      .item input{text-align:left}
    }
  </style>
</head>
<body>
  <header>
    <div class="banner" id="banner"></div>
    <nav id="nav"></nav>
  </header>

  <main id="main"></main>

  <div class="pie">
    <span class="contador" id="contador"></span>
    <button type="button" onclick="enviar()">✅ Enviar formulario</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="tarjeta" id="tarjeta"></div>
  </div>

<script>
  
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(txt != null) e.textContent = txt;
    return e;
  }

  
  if (BANNER){
    var img = document.createElement('img');
    img.src = BANNER; img.alt = 'ICMAN-CSIC';
    img.style.cursor = 'pointer';
    img.onclick = function(){ mostrar('inicio'); };
    document.getElementById('banner').appendChild(img);
  }

  
  var nav = document.getElementById('nav');
  var main = document.getElementById('main');

  var btnInicio = el('button','inicio','🏠 Inicio');
  btnInicio.dataset.key = 'inicio';
  btnInicio.onclick = function(){ mostrar('inicio'); };
  nav.appendChild(btnInicio);

  DATOS.forEach(function(bloque, idx){
    var b = el('button', null, bloque.etiqueta);
    b.dataset.key = 'b'+idx;
    b.onclick = function(){ mostrar('b'+idx); };
    nav.appendChild(b);
  });

  var btnComent = el('button', null, '💬 Comentarios');
  btnComent.dataset.key = 'comentarios';
  btnComent.onclick = function(){ mostrar('comentarios'); };
  nav.appendChild(btnComent);

  nav.appendChild(el('span','sep'));
  var btnEnviarNav = el('button','enviar','✅ Enviar');
  btnEnviarNav.onclick = enviar;
  nav.appendChild(btnEnviarNav);

  
  var portada = el('section','seccion');
  portada.id = 'sec-inicio';
  portada.appendChild(el('h1', null, TITULO));
  portada.appendChild(el('div','intro', INTRO));
  main.appendChild(portada);

  
  DATOS.forEach(function(bloque, idx){
    var sec = el('section','seccion');
    sec.id = 'sec-b'+idx;
    sec.appendChild(el('div','bloque-tit', bloque.bloque));
    sec.appendChild(el('p','bloque-sub','Indique el número que se espera conseguir/aportar en 2026.'));

    bloque.indicadores.forEach(function(ind){
      var card = el('div','indicador');
      card.appendChild(el('h3', null, 'INDICADOR: ' + ind.indicador));
      if (ind.nota) card.appendChild(el('p','nota', ind.nota));

      ind.items.forEach(function(it){
        var row = el('div','item');

        var txt = el('div','txt');
        var q = el('div','q');
        q.appendChild(document.createTextNode(it.item + ' '));
        if (it.unidad) q.appendChild(el('span','unidad','(' + it.unidad + ')'));
        txt.appendChild(q);

        
        var obj = el('span','obj');
        obj.appendChild(document.createTextNode('🎯 Objetivo PCO oficial 2026: '));
        obj.appendChild(el('strong', null, it.objetivoTxt));
        txt.appendChild(obj);

        if (it.def) txt.appendChild(el('span','def', it.def));
        row.appendChild(txt);

        var campo = el('div','campo');
        var inp = document.createElement('input');
        inp.type = 'number'; inp.min = '0'; inp.step = 'any';
        inp.setAttribute('inputmode','decimal');
        inp.setAttribute('data-id', it.id);
        inp.setAttribute('aria-label', it.item);
        inp.placeholder = 'Nº';
        inp.oninput = actualizarContador;
        campo.appendChild(inp);
        row.appendChild(campo);

        card.appendChild(row);
      });
      sec.appendChild(card);
    });
    main.appendChild(sec);
  });

  
  var secC = el('section','seccion');
  secC.id = 'sec-comentarios';
  secC.appendChild(el('div','bloque-tit','Comentarios y contacto'));
  secC.appendChild(el('p','bloque-sub','Todos los campos de esta sección son opcionales.'));

  var cardContacto = el('div','indicador');
  cardContacto.appendChild(el('h3', null, 'Contacto (opcional)'));
  cardContacto.appendChild(el('p','nota',
    'La encuesta puede responderse de forma anónima. Si se desea que la respuesta ' +
    'quede identificada, indíquese el correo electrónico; en caso contrario, déjese en blanco.'));
  var email = document.createElement('input');
  email.type = 'email';
  email.id = 'campo-email';
  email.className = 'meta-input';
  email.setAttribute('autocomplete','email');
  email.setAttribute('aria-label','Correo electrónico (opcional)');
  email.placeholder = 'nombre@ejemplo.com';
  cardContacto.appendChild(email);
  secC.appendChild(cardContacto);

  var cardComent = el('div','indicador');
  cardComent.appendChild(el('h3', null, 'Comentarios (opcional)'));
  cardComent.appendChild(el('p','nota',
    'Puede indicarse cualquier observación, aclaración o sugerencia sobre la PCO 2026.'));
  var ta = document.createElement('textarea');
  ta.id = 'campo-comentarios';
  ta.className = 'meta-input';
  ta.rows = 6;
  ta.setAttribute('aria-label','Comentarios (opcional)');
  ta.placeholder = 'Escriba aquí sus comentarios…';
  cardComent.appendChild(ta);
  secC.appendChild(cardComent);

  main.appendChild(secC);

  
  function mostrar(key){
    var secciones = document.querySelectorAll('.seccion');
    for (var i=0;i<secciones.length;i++) secciones[i].classList.remove('activa');
    var destino = document.getElementById('sec-' + key);
    if (destino) destino.classList.add('activa');

    var botones = nav.querySelectorAll('button');
    for (var j=0;j<botones.length;j++){
      botones[j].classList.toggle('activo', botones[j].dataset.key === key);
    }
    window.scrollTo(0, 0);
  }

  
  function actualizarContador(){
    var inputs = document.querySelectorAll('input[data-id]');
    var n = 0;
    for (var i=0;i<inputs.length;i++) if (inputs[i].value.trim() !== '') n++;
    document.getElementById('contador').textContent = n + ' / ' + inputs.length + ' campos rellenados';
  }

  
  function enviar(){
    if (!FORM_URL || !MAP){
      alert('La página no está conectada al formulario (faltan FORM_URL / MAP). ' +
            'Vuelve a generar la página con el script.');
      return;
    }
    
    var emailEl = document.getElementById('campo-email');
    var emailVal = emailEl ? emailEl.value.trim() : '';
    if (emailVal && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)){
      mostrar('comentarios');
      if (emailEl) emailEl.focus();
      alert('El correo electrónico introducido no parece válido. Corríjalo o déjelo en blanco.');
      return;
    }
    var comentEl = document.getElementById('campo-comentarios');
    var comentVal = comentEl ? comentEl.value.trim() : '';

    var inputs = document.querySelectorAll('input[data-id]');
    var body = new URLSearchParams();
    var n = 0;
    for (var i=0;i<inputs.length;i++){
      var v = inputs[i].value.trim();
      if (v !== '' && isFinite(Number(v))){
        var entry = MAP[inputs[i].getAttribute('data-id')];
        if (entry){ body.append('entry.' + entry, v); n++; }
      }
    }
    if (emailVal   && MAP[ID_EMAIL])       body.append('entry.' + MAP[ID_EMAIL], emailVal);
    if (comentVal  && MAP[ID_COMENTARIOS]) body.append('entry.' + MAP[ID_COMENTARIOS], comentVal);

    if (n === 0 && !emailVal && !comentVal &&
        !confirm('No se ha introducido ningún dato. ¿Enviar de todos modos?')) return;

    mostrarOverlay('<div class="spin"></div><h2>Enviando…</h2><p>Un momento, por favor.</p>');

    
    
    fetch(FORM_URL, { method:'POST', mode:'no-cors', body: body })
      .then(function(){
        mostrarOverlay('<h2>¡Gracias!</h2><p>Las respuestas se han registrado correctamente.</p>' +
          '<button type="button" onclick="location.reload()">Enviar otra respuesta</button>');
      })
      .catch(function(){
        mostrarOverlay('<h2>Error de conexión</h2>' +
          '<p>No se pudo enviar. Comprueba tu conexión a internet e inténtalo de nuevo.</p>' +
          '<button type="button" onclick="ocultarOverlay()">Volver</button>');
      });
  }

  function mostrarOverlay(html){
    document.getElementById('tarjeta').innerHTML = html;
    document.getElementById('overlay').classList.add('visible');
  }
  function ocultarOverlay(){
    document.getElementById('overlay').classList.remove('visible');
  }

  
  mostrar('inicio');
  actualizarContador();
</script>
</body>
</html>
