<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nota de cargo interno de los Servicios Científico-Técnicos del CSIC</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <style>:root {
  --rojo: #b30000;          /* rojo CSIC */
  --rojo-osc: #7a0000;
  --azul: #1f4e79;
  --azul-cl: #e8f0f8;
  --gris: #f4f5f7;
  --gris-bd: #d6dae0;
  --texto: #1c2530;
  --tenue: #5b6675;
  --verde: #1d7a46;
  --ambar: #9a6b00;
  --sombra: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.06);
  --radio: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--texto); background: var(--gris); line-height: 1.5; font-size: 15px;
}
a { color: var(--azul); }

header.app {
  background: linear-gradient(100deg, var(--rojo), var(--rojo-osc));
  color: #fff; padding: 8px 22px; display: flex; align-items: center; gap: 14px;
  box-shadow: var(--sombra); position: sticky; top: 0; z-index: 10;
}
header.app .marca { font-weight: 700; font-size: 16px; letter-spacing: .3px; }
header.app .sub { opacity: .85; font-size: 12px; }
header.app .acciones { margin-left: auto; display: flex; gap: 8px; }
header.app .logo-cab {
  height: 30px; width: auto; background: #fff; padding: 3px 7px; border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,.18); flex: 0 0 auto;
}
@media (max-width: 560px) { header.app .logo-cab { height: 26px; } }

.layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; max-width: 1180px; margin: 22px auto; padding: 0 18px; }
@media (max-width: 920px) { .layout { grid-template-columns: 1fr; } .resumen-panel { position: static !important; } }

.tarjeta { background: #fff; border: 1px solid var(--gris-bd); border-radius: var(--radio); box-shadow: var(--sombra); }
.paso { padding: 22px 24px; }
.paso h2 { margin: 0 0 4px; font-size: 20px; color: var(--rojo-osc); }
.paso .ayuda { color: var(--tenue); font-size: 13.5px; margin: 0 0 18px; }
.paso h3.sub-sec { font-size: 13px; color: var(--azul); text-transform: uppercase; letter-spacing: .4px; margin: 20px 0 2px; border-bottom: 1px solid var(--gris-bd); padding-bottom: 4px; }

.progreso { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 24px; border-bottom: 1px solid var(--gris-bd); background: #fff; }
.progreso .hito { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: var(--gris); color: var(--tenue); border: 1px solid var(--gris-bd); cursor: pointer; }
.progreso .hito.activo { background: var(--rojo); color: #fff; border-color: var(--rojo); }
.progreso .hito.hecho { background: var(--azul-cl); color: var(--azul); border-color: #bcd3ea; }

label.campo { display: block; margin: 14px 0; }
label.campo > .et { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
label.campo > .nota { font-weight: 400; color: var(--tenue); font-size: 12.5px; }

input[type=text], input[type=number], input[type=email], select, textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--gris-bd); border-radius: 8px;
  font: inherit; background: #fff; color: var(--texto);
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--azul-cl); border-color: var(--azul); }
textarea { min-height: 64px; resize: vertical; }
.dos-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 560px) { .dos-col { grid-template-columns: 1fr; } }

.botonera { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid transparent; padding: 10px 18px; font-weight: 600; }
button.primario { background: var(--rojo); color: #fff; }
button.primario:hover { background: var(--rojo-osc); }
button.sec { background: #fff; color: var(--texto); border-color: var(--gris-bd); }
button.sec:hover { border-color: var(--azul); color: var(--azul); }
button.tenue { background: transparent; color: var(--tenue); }
button:disabled { opacity: .5; cursor: not-allowed; }

/* Conceptos repetibles */
.fila-rep { border: 1px dashed var(--gris-bd); border-radius: 10px; padding: 14px; margin: 12px 0; position: relative; background: #fcfcfd; }
.fila-rep .quitar { position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: var(--rojo); font-size: 18px; padding: 2px 8px; cursor: pointer; }
.fila-rep .cab-fila { font-weight: 700; color: var(--azul); font-size: 13px; margin-bottom: 6px; }
.fila-rep .sub-importe { margin-top: 8px; font-size: 13px; color: var(--tenue); }
.fila-rep .sub-importe b { color: var(--texto); font-variant-numeric: tabular-nums; }
.tres-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 14px; }
@media (max-width: 560px) { .tres-col { grid-template-columns: 1fr; } }
button.anadir { background: var(--azul-cl); color: var(--azul); border: 1px dashed #9cbce0; margin-top: 4px; }

.resumen-panel { position: sticky; top: 86px; align-self: start; }
.resumen-panel .cab { background: var(--azul); color: #fff; padding: 12px 16px; border-radius: var(--radio) var(--radio) 0 0; font-weight: 700; font-size: 15px; }
.resumen-panel .cuerpo { padding: 14px 16px; }
.linea { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--gris-bd); font-size: 14px; }
.linea:last-child { border-bottom: none; }
.linea .v { font-variant-numeric: tabular-nums; font-weight: 600; }
.linea.total .v { color: var(--rojo-osc); font-size: 18px; }
.linea .et small { display: block; color: var(--tenue); font-weight: 400; font-size: 11.5px; }
.aviso { background: #fff8e6; border: 1px solid #f0d98c; color: var(--ambar); padding: 9px 12px; border-radius: 8px; font-size: 13px; margin: 10px 0; }
.nota-norm { font-size: 11.5px; color: var(--tenue); border-left: 3px solid var(--gris-bd); padding: 2px 0 2px 10px; margin: 6px 0; }
.chip { display: inline-block; font-size: 11px; background: var(--azul-cl); color: var(--azul); border-radius: 12px; padding: 1px 9px; margin-left: 6px; }

/* Tabla de revisión */
.tabla-rev { width: 100%; border-collapse: collapse; margin: 10px 0 4px; font-size: 13.5px; }
.tabla-rev th, .tabla-rev td { border: 1px solid var(--gris-bd); padding: 7px 9px; text-align: left; }
.tabla-rev th { background: var(--azul); color: #fff; font-weight: 600; }
.tabla-rev td.num, .tabla-rev th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tabla-rev tr.total td { font-weight: 700; background: var(--azul-cl); }
.bloque-rev { margin: 6px 0 18px; }
.bloque-rev h3 { font-size: 14px; color: var(--azul); margin: 0 0 6px; border-bottom: 1px solid var(--gris-bd); padding-bottom: 4px; }
.bloque-rev .dato { font-size: 13.5px; padding: 2px 0; }
.bloque-rev .dato b { color: var(--tenue); font-weight: 600; }
.descargas { display: grid; gap: 12px; margin-top: 6px; }
.descargas .tarj-desc { display: flex; align-items: center; gap: 14px; border: 1px solid var(--gris-bd); border-left: 4px solid var(--rojo); border-radius: 10px; padding: 14px 16px; background: #fff; }
.descargas .tarj-desc .ico { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: #fff; }
.descargas .tarj-desc .ico.docx { background: #1b5e9b; }
.descargas .tarj-desc .ico.pdf { background: var(--rojo); }
.descargas .tarj-desc .txt { flex: 1 1 auto; }
.descargas .tarj-desc .txt .t { font-weight: 700; color: var(--azul); }
.descargas .tarj-desc .txt .d { font-size: 12.5px; color: var(--tenue); }

@media print {
  header.app, .resumen-panel, .progreso, .botonera, .no-print { display: none !important; }
  .layout { display: block; margin: 0; }
  body { background: #fff; }
}
</style>
</head>
<body>
  <header class="app">
    <img class="logo-cab" src="../docs/logos/banner-oficial.png" alt="Gobierno de España · Ministerio de Ciencia, Innovación y Universidades · CSIC · ICMAN">
    <div>
      <div class="marca">Nota de cargo interno · CSIC</div>
      <div class="sub">Cumplimentación del formulario oficial de cargo interno del Servicio Científico-Técnico (PDF)</div>
    </div>
    <div class="acciones">
      <button class="sec no-print" id="btn-guardar" title="Descargar la sesión en JSON">Guardar</button>
      <button class="sec no-print" id="btn-cargar" title="Cargar una sesión guardada">Cargar</button>
      <button class="tenue no-print" id="btn-nuevo" style="color:#fff">Nuevo</button>
      <input type="file" id="cargar-archivo" accept="application/json" style="display:none">
    </div>
  </header>

  <div id="progreso" class="progreso"></div>

  <div class="layout">
    <main id="paso" class="tarjeta paso"></main>
    <aside class="resumen-panel">
      <div class="tarjeta">
        <div class="cab">Cargo interno</div>
        <div class="cuerpo" id="panel-cuerpo"></div>
      </div>
    </aside>
  </div>

  <script>/*
 * Relleno del formulario oficial «Nota de cargo interno de los Servicios
 * Científico-Técnicos» (PDF AcroForm). Se reutiliza el PDF oficial íntegro:
 * con pdf-lib se cumplimentan sus 17 campos de formulario (incluidos los tres
 * desplegables) y se vuelve a guardar, de modo que el PDF resultante es el
 * documento oficial relleno, conservando su diseño, membrete y notas al pie.
 */
(function (global) {
  "use strict";
  var SCT = global.SCT || (global.SCT = {});

  // Campos de tipo desplegable (el resto son de texto).
  var DESPLEGABLES = ["umc_variante", "centroInstituto_solicitante", "centroInstituto_prestador"];

  function b64ToU8(b64) {
    var bin = atob(b64), len = bin.length, u8 = new Uint8Array(len);
    for (var i = 0; i < len; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }
  // Número -> "1.234,56" (formato español, dos decimales).
  function num2(x) {
    var n = Number(x); if (!isFinite(n)) n = 0;
    var s = n.toFixed(2).split(".");
    var ent = s[0], signo = "";
    if (ent.charAt(0) === "-") { signo = "-"; ent = ent.slice(1); }
    ent = ent.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return signo + ent + "," + s[1];
  }
  // Número entero/decimal sin decimales forzados (para nº de unidades).
  function numLibre(x) {
    if (x === "" || x == null) return "";
    var n = Number(x); if (!isFinite(n)) return String(x);
    return String(n).replace(".", ",");
  }

  async function generar(pdfU8, datos) {
    var PDFLib = global.PDFLib;
    if (!PDFLib) throw new Error("No se ha cargado pdf-lib.");
    var doc = await PDFLib.PDFDocument.load(pdfU8);
    var form = doc.getForm();

    Object.keys(datos).forEach(function (name) {
      var val = datos[name];
      if (val == null) val = "";
      val = String(val);
      try {
        if (DESPLEGABLES.indexOf(name) >= 0) {
          var dd = form.getDropdown(name);
          if (val === "") return; // sin selección: se deja como está
          var ops = dd.getOptions();
          if (ops.indexOf(val) >= 0) dd.select(val);
          else { try { dd.setOptions(ops.concat([val])); dd.select(val); } catch (e) {} }
        } else {
          form.getTextField(name).setText(val);
        }
      } catch (e) {
        if (global.console) console.warn("Campo no rellenado:", name, e.message);
      }
    });

    // Genera las apariencias para que los valores se vean en todos los visores.
    try { form.updateFieldAppearances(); } catch (e) {}
    return await doc.save();
  }

  SCT.nota = { generar: generar, b64ToU8: b64ToU8, num2: num2, numLibre: numLibre };

  if (typeof module !== "undefined" && module.exports) module.exports = SCT.nota;
})(typeof window !== "undefined" ? window : globalThis);
</script>
  <script>/*
 * Interfaz "ask-me-anything" para cumplimentar la «Nota de cargo interno de los
 * Servicios Científico-Técnicos» del CSIC y descargar el formulario oficial
 * (PDF) ya relleno. Sin dependencias externas salvo SCT.nota (pdf-lib) y los
 * activos embebidos. No se precarga ningún dato.
 */
(function (global) {
  "use strict";
  var SCT = global.SCT;
  var INDIRECTO = 0.173; // 17,3 % de los costes marginales (norma COIN).

  // ---- estado canónico (sin ningún dato por defecto) ----
  function estadoInicial() {
    return {
      solicitante: { nombre: "", proyecto: "", centro: "" },
      prestador: { centro: "", codigo: "", cuenta: "" },
      variante: { nombre: "", umc: "", numero: "" },
      costes: { margUmc: "", totalUmc: "", marginal: "", viajes: "", cuentaIndirectos: "", fecha: "" },
    };
  }
  var estado = estadoInicial();

  // ---- opciones de los desplegables (extraídas del PDF oficial) ----
  function ops(nombre) {
    return (SCT.OPCIONES[nombre] || []).filter(function (o) { return String(o).trim() !== ""; });
  }

  // ---- utilidades DOM ----
  function el(tag, attrs, hijos) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "html") n.innerHTML = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k === "style") n.setAttribute("style", attrs[k]);
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (hijos || []).forEach(function (h) {
      if (h == null) return;
      n.appendChild(typeof h === "string" ? document.createTextNode(h) : h);
    });
    return n;
  }
  function campo(etiqueta, input, nota) {
    return el("label", { class: "campo" }, [
      el("span", { class: "et" }, [etiqueta, nota ? el("span", { class: "nota" }, [" — " + nota]) : null]),
      input,
    ]);
  }
  function inputTexto(valor, onInput, attrs) {
    var i = el("input", Object.assign({ type: "text", value: valor || "" }, attrs || {}));
    i.addEventListener("input", function () { onInput(i.value); });
    return i;
  }
  function inputNum(valor, onInput, attrs) {
    var i = el("input", Object.assign({ type: "number", step: "any", min: "0", value: (valor === "" || valor == null ? "" : valor) }, attrs || {}));
    i.addEventListener("input", function () { onInput(i.value === "" ? "" : parseFloat(i.value)); recalcular(); });
    return i;
  }
  function selector(opciones, valor, onChange, placeholder) {
    var s = el("select");
    if (placeholder) s.appendChild(el("option", { value: "" }, [placeholder]));
    (opciones || []).forEach(function (o) {
      var op = el("option", { value: o }, [o]); if (o === valor) op.selected = true; s.appendChild(op);
    });
    s.addEventListener("change", function () { onChange(s.value); });
    return s;
  }
  function n(x) { var v = Number(x); return isFinite(v) ? v : 0; }
  function eur(x) { return SCT.nota.num2(x) + " €"; }
  function totalCargo() { return n(estado.costes.marginal) + n(estado.costes.viajes); }
  function indirectos() { return n(estado.costes.marginal) * INDIRECTO; }

  function sanitizar(s) {
    return (s || "documento").normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[\/\\:.;]+/g, "_").replace(/[^A-Za-z0-9_\- ]+/g, "").trim().replace(/\s+/g, "_") || "documento";
  }

  // ---- pasos ----
  var pasoActual = 0;
  var PASOS = [
    { id: "solicitante", titulo: "Solicitante", render: pasoSolicitante },
    { id: "prestador", titulo: "Servicio prestador", render: pasoPrestador },
    { id: "variante", titulo: "Variante", render: pasoVariante },
    { id: "costes", titulo: "Costes y fecha", render: pasoCostes },
    { id: "revision", titulo: "Revisión y descarga", render: pasoRevision },
  ];

  // 1. Solicitante
  function pasoSolicitante(c) {
    c.appendChild(el("h2", {}, ["Datos del solicitante"]));
    c.appendChild(el("p", { class: "ayuda" }, ["Quién solicita la prestación y a qué proyecto o centro se imputa el cargo."]));
    var s = estado.solicitante;
    c.appendChild(campo("Nombre y apellidos del solicitante", inputTexto(s.nombre, function (v) { s.nombre = v; }, { placeholder: "Nombre y apellidos" })));
    c.appendChild(campo("Referencia del proyecto de la entidad financiadora", inputTexto(s.proyecto, function (v) { s.proyecto = v; }, { placeholder: "p. ej. PID2023-XXXXXX" }),
      "referencia del proyecto que financia el servicio"));
    c.appendChild(campo("Centro / instituto solicitante", selector(ops("centroInstituto_solicitante"), s.centro, function (v) { s.centro = v; }, "— Seleccione el centro —"),
      "centro del CSIC que solicita la prestación"));
  }

  // 2. Servicio prestador
  function pasoPrestador(c) {
    c.appendChild(el("h2", {}, ["Servicio Científico-Técnico prestador"]));
    c.appendChild(el("p", { class: "ayuda" }, ["Centro que oferta la variante, su código de servicio y la cuenta interna en la que se anotará el cargo."]));
    var p = estado.prestador;
    c.appendChild(campo("Centro / instituto que oferta la variante", selector(ops("centroInstituto_prestador"), p.centro, function (v) { p.centro = v; }, "— Seleccione el centro —"),
      "centro del CSIC que presta el servicio"));
    var g = el("div", { class: "dos-col" });
    g.appendChild(campo("Código de servicio", inputTexto(p.codigo, function (v) { p.codigo = v; }, { placeholder: "código del SCT" })));
    g.appendChild(campo("Número de cuenta interna del servicio", inputTexto(p.cuenta, function (v) { p.cuenta = v; }, { placeholder: "cuenta en la que se anota el cargo" }),
      "donde se anota el cargo interno"));
    c.appendChild(g);
  }

  // 3. Variante
  function pasoVariante(c) {
    c.appendChild(el("h2", {}, ["Datos de la variante"]));
    c.appendChild(el("p", { class: "ayuda" }, ["Variante de la prestación, su unidad de medida de coste (UMC) y el número de unidades solicitadas."]));
    var v = estado.variante;
    c.appendChild(campo("Nombre de la variante", inputTexto(v.nombre, function (x) { v.nombre = x; }, { placeholder: "nombre de la variante prestada" })));
    var g = el("div", { class: "dos-col" });
    g.appendChild(campo("Unidad de medida de coste (UMC)", selector(ops("umc_variante"), v.umc, function (x) { v.umc = x; }, "— Seleccione la UMC —")));
    g.appendChild(campo("Número de unidades solicitadas", inputNum(v.numero, function (x) { v.numero = x; }, { min: "0", step: "any", placeholder: "0" })));
    c.appendChild(g);
  }

  // 4. Costes y fecha
  function pasoCostes(c) {
    c.appendChild(el("h2", {}, ["Costes de la variante y fecha"]));
    c.appendChild(el("p", { class: "ayuda" }, ["Importes obtenidos de la plantilla oficial de cálculo de costes. El total del cargo y los costes indirectos se calculan automáticamente."]));
    var co = estado.costes;

    c.appendChild(el("h3", { class: "sub-sec" }, ["Costes por unidad de medida (UMC)"]));
    var g1 = el("div", { class: "dos-col" });
    g1.appendChild(campo("Costes marginales por UMC (€)", inputNum(co.margUmc, function (v) { co.margUmc = v; }, { step: "any" })));
    g1.appendChild(campo("Coste total por UMC (€)", inputNum(co.totalUmc, function (v) { co.totalUmc = v; }, { step: "any" })));
    c.appendChild(g1);

    c.appendChild(el("h3", { class: "sub-sec" }, ["Costes según el número de unidades solicitadas"]));
    var g2 = el("div", { class: "dos-col" });
    g2.appendChild(campo("Costes marginales (€)", inputNum(co.marginal, function (v) { co.marginal = v; }, { step: "any" }),
      "base del cargo interno"));
    g2.appendChild(campo("Costes de viajes y dietas (€)", inputNum(co.viajes, function (v) { co.viajes = v; }, { step: "any" }),
      "se suman al cargo interno"));
    c.appendChild(g2);

    // Cálculos automáticos
    var calc = el("div", { class: "bloque-rev", style: "margin-top:8px" }, [
      el("h3", {}, ["Cálculo automático"]),
      el("div", { class: "dato" }, [el("b", {}, ["Total cargo interno (marginales + viajes y dietas): "]), eur(totalCargo())]),
      el("div", { class: "dato" }, [el("b", {}, ["Costes indirectos (17,3 % de los marginales): "]), eur(indirectos())]),
    ]);
    c.appendChild(calc);
    c.appendChild(el("div", { class: "nota-norm" }, ["Los costes elegibles figuran como «0» en la nota de cargo interno: en las auditorías de proyectos solo se imputan las tarifas internas calculadas en la plantilla de costes."]));

    c.appendChild(el("h3", { class: "sub-sec" }, ["Si el solicitante es otro centro del CSIC"]));
    c.appendChild(campo("Cuenta interna de funcionamiento para los costes indirectos", inputTexto(co.cuentaIndirectos, function (v) { co.cuentaIndirectos = v; }, { placeholder: "cuenta del centro prestador" }),
      "solo si el centro solicitante es distinto del prestador"));

    c.appendChild(campo("Fecha de prestación del servicio", inputTexto(co.fecha, function (v) { co.fecha = v; }, { placeholder: "p. ej. 3 de junio de 2026" })));
  }

  // 5. Revisión y descarga
  function dato(et, val) {
    return el("div", { class: "dato" }, [el("b", {}, [et + ": "]), (val == null || val === "") ? "—" : String(val)]);
  }
  function pasoRevision(c) {
    c.appendChild(el("h2", {}, ["Revisión y descarga"]));
    c.appendChild(el("p", { class: "ayuda" }, ["Compruebe los datos y descargue el formulario oficial de nota de cargo interno en PDF, ya cumplimentado."]));
    var s = estado.solicitante, p = estado.prestador, v = estado.variante, co = estado.costes;

    c.appendChild(el("div", { class: "bloque-rev" }, [el("h3", {}, ["Solicitante"]),
      dato("Nombre", s.nombre), dato("Proyecto", s.proyecto), dato("Centro solicitante", s.centro)]));
    c.appendChild(el("div", { class: "bloque-rev" }, [el("h3", {}, ["Servicio prestador"]),
      dato("Centro prestador", p.centro), dato("Código de servicio", p.codigo), dato("Cuenta interna", p.cuenta)]));
    c.appendChild(el("div", { class: "bloque-rev" }, [el("h3", {}, ["Variante"]),
      dato("Variante", v.nombre), dato("UMC", v.umc), dato("Unidades", v.numero === "" ? "—" : v.numero)]));
    c.appendChild(el("div", { class: "bloque-rev" }, [el("h3", {}, ["Costes"]),
      dato("Marginales por UMC", eur(co.margUmc)), dato("Total por UMC", eur(co.totalUmc)),
      dato("Marginales (uds.)", eur(co.marginal)), dato("Viajes y dietas", eur(co.viajes)),
      dato("Total cargo interno", eur(totalCargo())), dato("Costes indirectos (17,3 %)", eur(indirectos())),
      dato("Fecha de prestación", co.fecha)]));

    var card = el("div", { class: "tarj-desc" }, [
      el("div", { class: "ico pdf" }, ["PDF"]),
      el("div", { class: "txt" }, [el("div", { class: "t" }, ["Nota de cargo interno (.pdf)"]), el("div", { class: "d" }, ["Formulario oficial cumplimentado, con su diseño, membrete y notas. Editable y listo para firmar."])]),
      el("button", { class: "primario", onclick: generarPDF }, ["Descargar PDF"]),
    ]);
    c.appendChild(el("div", { class: "bloque-rev" }, [el("h3", {}, ["Descargar la nota de cargo"]), el("div", { class: "descargas" }, [card])]));
    c.appendChild(el("div", { class: "nota-norm" }, ["Documento orientativo generado de forma local en su navegador. Revise siempre los importes y las cuentas antes de su tramitación oficial."]));
  }

  // ---- panel resumen ----
  function linea(et, val, clase) {
    return el("div", { class: "linea" + (clase ? " " + clase : "") }, [el("span", { class: "et" }, [et]), el("span", { class: "v" }, [val])]);
  }
  function recalcular() {
    var cont = document.getElementById("panel-cuerpo");
    if (!cont) return;
    cont.innerHTML = "";
    cont.appendChild(linea("Costes marginales (uds.)", eur(estado.costes.marginal)));
    cont.appendChild(linea("Viajes y dietas", eur(estado.costes.viajes)));
    cont.appendChild(linea("Total cargo interno", eur(totalCargo()), "total"));
    cont.appendChild(linea("Costes indirectos (17,3 %)", eur(indirectos())));
  }

  // ---- datos -> campos del formulario ----
  function mapaCampos() {
    var s = estado.solicitante, p = estado.prestador, v = estado.variante, co = estado.costes;
    var num2 = SCT.nota.num2, numLibre = SCT.nota.numLibre;
    return {
      nombre_apellidos_solicitante: s.nombre,
      proyecto: s.proyecto,
      centroInstituto_solicitante: s.centro,
      centroInstituto_prestador: p.centro,
      codigo_sct: p.codigo,
      cuenta_interna_servicio: p.cuenta,
      nombre_variante: v.nombre,
      umc_variante: v.umc,
      numero_umc_variante: (v.numero === "" || v.numero == null) ? "" : numLibre(v.numero),
      coste_marginal_umc: num2(co.margUmc),
      coste_total_umc: num2(co.totalUmc),
      coste_marginal: num2(co.marginal),
      coste_viajes_y_dietas: num2(co.viajes),
      total_cargo_interno: num2(totalCargo()),
      costes_indirectos: num2(indirectos()),
      cuenta_interna_funcionamiento: co.cuentaIndirectos,
      fecha_prestacion: co.fecha,
    };
  }

  // ---- descargas ----
  function descargar(nombre, datos, mime) {
    var blob = datos instanceof Blob ? datos : new Blob([datos], { type: mime || "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = el("a", { href: url, download: nombre }); document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  }
  function nombreBase() {
    return sanitizar((estado.prestador.codigo || "nota_de_cargo") + "_" + (estado.solicitante.nombre || estado.costes.fecha || ""));
  }
  function generarPDF() {
    var btnTexto = "Descargar PDF";
    SCT.nota.generar(SCT.nota.b64ToU8(SCT.PDF_B64), mapaCampos())
      .then(function (u8) {
        descargar("NOTA_DE_CARGO_" + nombreBase() + ".pdf", new Blob([u8], { type: "application/pdf" }));
      })
      .catch(function (e) { alert("Error al generar el PDF: " + e.message); if (global.console) console.error(e); });
  }

  // ---- guardar / cargar sesión ----
  function guardarSesion() { descargar("nota_cargo_sesion_" + nombreBase() + ".json", JSON.stringify(estado, null, 2), "application/json"); }
  function cargarSesion(file) {
    var fr = new FileReader();
    fr.onload = function () { try { estado = JSON.parse(fr.result); pasoActual = 0; render(); } catch (e) { alert("Archivo no válido"); } };
    fr.readAsText(file);
  }
  function autoguardar() { try { localStorage.setItem("sct_nota_cargo", JSON.stringify(estado)); } catch (e) {} }
  function restaurar() { try { var s = localStorage.getItem("sct_nota_cargo"); if (s) estado = JSON.parse(s); } catch (e) {} }

  // ---- render ----
  function render() {
    if (pasoActual >= PASOS.length) pasoActual = PASOS.length - 1;
    if (pasoActual < 0) pasoActual = 0;
    var prog = document.getElementById("progreso"); prog.innerHTML = "";
    PASOS.forEach(function (p, i) {
      prog.appendChild(el("span", { class: "hito" + (i === pasoActual ? " activo" : i < pasoActual ? " hecho" : ""), onclick: function () { pasoActual = i; render(); } }, [(i + 1) + ". " + p.titulo]));
    });
    var cont = document.getElementById("paso"); cont.innerHTML = "";
    PASOS[pasoActual].render(cont);
    var bt = el("div", { class: "botonera" });
    if (pasoActual > 0) bt.appendChild(el("button", { class: "sec", onclick: function () { pasoActual--; render(); } }, ["← Anterior"]));
    if (pasoActual < PASOS.length - 1) bt.appendChild(el("button", { class: "primario", onclick: function () { pasoActual++; render(); } }, ["Siguiente →"]));
    if (pasoActual === PASOS.length - 1) bt.appendChild(el("button", { class: "primario", onclick: generarPDF }, ["Descargar PDF"]));
    cont.appendChild(bt);
    recalcular();
    autoguardar();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function montar() {
    restaurar();
    var cargarInput = document.getElementById("cargar-archivo");
    if (cargarInput) cargarInput.addEventListener("change", function (e) { if (e.target.files[0]) cargarSesion(e.target.files[0]); });
    var bg = document.getElementById("btn-guardar"); if (bg) bg.addEventListener("click", guardarSesion);
    var bc = document.getElementById("btn-cargar"); if (bc) bc.addEventListener("click", function () { cargarInput.click(); });
    var bn = document.getElementById("btn-nuevo"); if (bn) bn.addEventListener("click", function () { if (confirm("¿Desea iniciar una nota nueva? Se perderán los datos actuales.")) { estado = estadoInicial(); pasoActual = 0; render(); } });
    render();
  }

  SCT.notaCargo = { montar: montar, getEstado: function () { return estado; }, mapaCampos: mapaCampos };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", montar);
  else montar();
})(typeof window !== "undefined" ? window : globalThis);
</script>
</body>
</html>
